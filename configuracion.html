<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configuración — Corralón Progreso</title>
  <link rel="icon" type="image/x-icon" href="https://tizyjenayrcdkcodsjnc.supabase.co/storage/v1/object/public/Archivos/icono-corralon-Photoroom.ico">
  <link rel="stylesheet" href="theme-corralon.css?v=20260722-19">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="menu-auth-guard.js?v=20260728-config1" data-menu-guard="configuracion"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f4f2;color:#111;font-family:Barlow,Arial,sans-serif}.page{width:min(940px,calc(100% - 28px));margin:24px auto}.top{display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid #d8d8d4;border-radius:18px 18px 0 0;background:#fff}.top h1{margin:0;font:900 34px "Barlow Condensed",Barlow,Arial}.top button{margin-left:auto}.card{padding:22px;border:1px solid #d8d8d4;border-top:0;border-radius:0 0 18px 18px;background:#fff;box-shadow:0 18px 45px rgba(0,0,0,.09)}.card h2{margin:0 0 4px;font:900 28px "Barlow Condensed",Barlow,Arial}.muted{margin:0 0 20px;color:#666;font-weight:700}.field{display:grid;gap:6px;max-width:440px}.field label{font-weight:900;text-transform:uppercase;font-size:13px}.field input{height:48px;padding:8px 13px;border:1px solid #aaa;border-radius:11px;background:#fff;font:800 20px Barlow,Arial}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{padding:14px;border:1px solid #d8d8d4;border-radius:12px;background:#f7f7f5}.stat span{display:block;color:#666;font-size:12px;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:20px}.progress{height:10px;border-radius:99px;background:#e4e4e1;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#14964f;transition:width .2s}.actions{display:flex;justify-content:flex-end;margin-top:20px}.actions button,.top button{height:42px;padding:0 20px;border:1px solid #aaa;border-radius:11px;background:#fff;font-weight:900;cursor:pointer}.actions .primary{border-color:#f10d18;background:#f10d18;color:#fff}.message{min-height:24px;margin-top:10px;color:#666;font-weight:800}.message.ok{color:#14964f}.message.error{color:#f10d18}@media(max-width:650px){.stats{grid-template-columns:1fr}.page{width:calc(100% - 16px);margin:8px auto}.top{padding:12px}.card{padding:16px}.top h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Configuración</h1>
      <button type="button" onclick="location.href='menu.html'">Menú</button>
    </header>
    <section class="card">
      <h2>Pedidos</h2>
      <p class="muted">Control global para todos los pedidos confirmados durante el mes calendario.</p>
      <div class="field">
        <label for="monthlyLimit">Límite mensual</label>
        <input id="monthlyLimit" inputmode="decimal" autocomplete="off" value="$ 30.000.000,00">
      </div>
      <div class="stats">
        <div class="stat"><span>Usado este mes</span><strong id="usedValue">Calculando...</strong></div>
        <div class="stat"><span>Disponible</span><strong id="availableValue">-</strong></div>
        <div class="stat"><span>Porcentaje utilizado</span><strong id="percentValue">-</strong></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="message" id="message"></div>
      <div class="actions"><button class="primary" id="saveBtn" type="button">Guardar configuración</button></div>
    </section>
  </main>
  <script>
    const FIREBASE_CONFIG={apiKey:'AIzaSyCxwUGX-rVusOI13j7oTfQuAtkeNXdAYH0',authDomain:'corralon-progreso.firebaseapp.com',projectId:'corralon-progreso',storageBucket:'corralon-progreso.firebasestorage.app',messagingSenderId:'466583614632',appId:'1:466583614632:web:42cb839f83e97475fabe9d'};
    const DEFAULT_LIMIT=30000000;
    const els={input:document.getElementById('monthlyLimit'),used:document.getElementById('usedValue'),available:document.getElementById('availableValue'),percent:document.getElementById('percentValue'),bar:document.getElementById('progressBar'),message:document.getElementById('message'),save:document.getElementById('saveBtn')};
    let db=null,used=0;
    function firestore(){if(db)return db;if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);return db=firebase.firestore()}
    function money(value){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2}).format(Number(value)||0)}
    function parseMoney(value){const clean=String(value||'').replace(/[^\d,.-]/g,'');if(!clean)return 0;if(clean.includes(','))return Number(clean.replace(/\./g,'').replace(',','.'))||0;const dots=(clean.match(/\./g)||[]).length;return Number(dots>1?clean.replace(/\./g,''):clean)||0}
    function monthKey(value){const text=String(value||'');let m=text.match(/^(\d{4})-(\d{2})/);if(m)return`${m[1]}-${m[2]}`;m=text.match(/^\d{1,2}\/(\d{1,2})\/(\d{4})/);return m?`${m[2]}-${String(m[1]).padStart(2,'0')}`:''}
    function currentMonth(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
    function paint(limit){const pct=limit>0?used/limit*100:0;els.used.textContent=money(used);els.available.textContent=money(Math.max(0,limit-used));els.percent.textContent=`${pct.toFixed(1).replace('.',',')} %`;els.bar.style.width=`${Math.min(100,pct)}%`;els.bar.style.background=pct>=100?'#f10d18':pct>=80?'#f0a000':'#14964f'}
    async function load(){try{const database=firestore();const [config,orders]=await Promise.all([database.collection('configuracion').doc('pedidos').get(),database.collection('pedidos').get()]);const limit=Number(config.exists?config.data()?.limiteMensual:0)||DEFAULT_LIMIT;used=0;const month=currentMonth();orders.docs.forEach(doc=>{const order=doc.data()||{};if(order.confirmado&&monthKey(order.fecha)===month)used+=Number(order.total||0)||0});els.input.value=money(limit);paint(limit)}catch(error){console.warn(error);els.message.textContent='No se pudo cargar la configuración.';els.message.className='message error'}}
    async function save(){const limit=parseMoney(els.input.value);if(!(limit>0)){els.message.textContent='Ingresá un límite mayor a cero.';els.message.className='message error';els.input.focus();return}els.save.disabled=true;els.message.textContent='Guardando...';try{let user={};try{user=JSON.parse(localStorage.getItem('corralon_menu_active_user_snapshot_v1')||'{}')}catch{}await firestore().collection('configuracion').doc('pedidos').set({limiteMensual:limit,updatedAt:Date.now(),updatedById:String(user.id||''),updatedByName:String(user.nombre||user.usuario||'')},{merge:true});els.input.value=money(limit);paint(limit);els.message.textContent='Configuración guardada.';els.message.className='message ok'}catch(error){console.warn(error);els.message.textContent='No se pudo guardar la configuración.';els.message.className='message error'}finally{els.save.disabled=false}}
    els.input.addEventListener('focus',()=>els.input.select());
    els.input.addEventListener('blur',()=>{const value=parseMoney(els.input.value);if(value>0)els.input.value=money(value)});
    els.input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();save()}});
    els.save.addEventListener('click',save);
    load();
  </script>
</body>
</html>
