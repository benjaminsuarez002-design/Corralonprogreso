<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configuración — Corralón Progreso</title>
  <link rel="icon" type="image/x-icon" href="https://tizyjenayrcdkcodsjnc.supabase.co/storage/v1/object/public/Archivos/icono-corralon-Photoroom.ico">
  <link rel="stylesheet" href="theme-corralon.css?v=20260722-19">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="menu-auth-guard.js?v=20260728-config1" data-menu-guard="configuracion"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f4f2;color:#111;font-family:Barlow,Arial,sans-serif}.page{width:min(940px,calc(100% - 28px));margin:24px auto}.top{display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid #d8d8d4;border-radius:18px 18px 0 0;background:#fff}.top h1{margin:0;font:900 34px "Barlow Condensed",Barlow,Arial}.top button{margin-left:auto}.card{padding:22px;border:1px solid #d8d8d4;border-top:0;border-radius:0 0 18px 18px;background:#fff;box-shadow:0 18px 45px rgba(0,0,0,.09)}.card h2{margin:0 0 4px;font:900 28px "Barlow Condensed",Barlow,Arial}.muted{margin:0 0 20px;color:#666;font-weight:700}.branch-limits{display:grid;grid-template-columns:1fr 1fr;gap:14px}.branch-limit{padding:16px;border:1px solid #d8d8d4;border-radius:15px;background:#fafaf8}.branch-limit h3{margin:0 0 13px;font:900 21px "Barlow Condensed",Barlow,Arial}.field{display:grid;gap:6px}.field label{font-weight:900;text-transform:uppercase;font-size:13px}.field input{height:48px;padding:8px 13px;border:1px solid #aaa;border-radius:11px;background:#fff;font:800 20px Barlow,Arial}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{padding:10px;border:1px solid #d8d8d4;border-radius:12px;background:#fff}.stat span{display:block;color:#666;font-size:10px;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:15px}.progress{height:8px;border-radius:99px;background:#e4e4e1;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#14964f;transition:width .2s}.actions{display:flex;justify-content:flex-end;margin-top:20px}.actions button,.top button{height:42px;padding:0 20px;border:1px solid #aaa;border-radius:11px;background:#fff;font-weight:900;cursor:pointer}.actions .primary{border-color:#f10d18;background:#f10d18;color:#fff}.message{min-height:24px;margin-top:10px;color:#666;font-weight:800}.message.ok{color:#14964f}.message.error{color:#f10d18}@media(max-width:760px){.branch-limits{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.page{width:calc(100% - 16px);margin:8px auto}.top{padding:12px}.card{padding:16px}.top h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Configuración</h1>
      <button type="button" onclick="location.href='menu.html'">Menú</button>
    </header>
    <section class="card">
      <h2>Pedidos</h2>
      <p class="muted">Límite independiente para los pedidos confirmados de cada sucursal durante el mes calendario.</p>
      <div class="branch-limits">
        <section class="branch-limit" data-branch="progreso_ruta">
          <h3>Suc. Progreso y Ruta</h3>
          <div class="field"><label for="monthlyLimitProgreso">Límite mensual</label><input id="monthlyLimitProgreso" data-limit-input inputmode="decimal" autocomplete="off" value="$ 30.000.000,00"></div>
          <div class="stats">
            <div class="stat"><span>Usado</span><strong data-used>Calculando...</strong></div>
            <div class="stat"><span>Disponible</span><strong data-available>-</strong></div>
            <div class="stat"><span>Utilizado</span><strong data-percent>-</strong></div>
          </div>
          <div class="progress"><i data-progress></i></div>
        </section>
        <section class="branch-limit" data-branch="calle5_espana">
          <h3>Suc. Calle 5 y España</h3>
          <div class="field"><label for="monthlyLimitCalle5">Límite mensual</label><input id="monthlyLimitCalle5" data-limit-input inputmode="decimal" autocomplete="off" value="$ 30.000.000,00"></div>
          <div class="stats">
            <div class="stat"><span>Usado</span><strong data-used>Calculando...</strong></div>
            <div class="stat"><span>Disponible</span><strong data-available>-</strong></div>
            <div class="stat"><span>Utilizado</span><strong data-percent>-</strong></div>
          </div>
          <div class="progress"><i data-progress></i></div>
        </section>
      </div>
      <div class="message" id="message"></div>
      <div class="actions"><button class="primary" id="saveBtn" type="button">Guardar configuración</button></div>
    </section>
  </main>
  <script>
    const FIREBASE_CONFIG={apiKey:'AIzaSyCxwUGX-rVusOI13j7oTfQuAtkeNXdAYH0',authDomain:'corralon-progreso.firebaseapp.com',projectId:'corralon-progreso',storageBucket:'corralon-progreso.firebasestorage.app',messagingSenderId:'466583614632',appId:'1:466583614632:web:42cb839f83e97475fabe9d'};
    const DEFAULT_LIMIT=30000000;
    const BRANCHES=['progreso_ruta','calle5_espana'];
    const els={cards:Object.fromEntries(BRANCHES.map(id=>[id,document.querySelector(`[data-branch="${id}"]`)])),message:document.getElementById('message'),save:document.getElementById('saveBtn')};
    let db=null,usedByBranch={progreso_ruta:0,calle5_espana:0};
    function firestore(){if(db)return db;if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);return db=firebase.firestore()}
    function money(value){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2}).format(Number(value)||0)}
    function parseMoney(value){const clean=String(value||'').replace(/[^\d,.-]/g,'');if(!clean)return 0;if(clean.includes(','))return Number(clean.replace(/\./g,'').replace(',','.'))||0;const dots=(clean.match(/\./g)||[]).length;return Number(dots>1?clean.replace(/\./g,''):clean)||0}
    function monthKey(value){const text=String(value||'');let m=text.match(/^(\d{4})-(\d{2})/);if(m)return`${m[1]}-${m[2]}`;m=text.match(/^\d{1,2}\/(\d{1,2})\/(\d{4})/);return m?`${m[2]}-${String(m[1]).padStart(2,'0')}`:''}
    function currentMonth(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
    function orderBranch(order){const raw=String(order?.sucursalId||order?.sucursal||'').toLowerCase();if(raw==='progreso_ruta'||raw.includes('progreso')||raw.includes('ruta'))return'progreso_ruta';if(raw==='calle5_espana'||raw.includes('calle 5')||raw.includes('calle5')||raw.includes('espana')||raw.includes('españa'))return'calle5_espana';return''}
    function configuredLimits(data={}){const legacy=Number(data.limiteMensual)||DEFAULT_LIMIT;return{progreso_ruta:Number(data.limitesMensuales?.progreso_ruta||data.limiteMensualProgresoRuta)||legacy,calle5_espana:Number(data.limitesMensuales?.calle5_espana||data.limiteMensualCalle5Espana)||legacy}}
    function inputFor(branch){return els.cards[branch].querySelector('[data-limit-input]')}
    function paint(branch,limit){const card=els.cards[branch],used=usedByBranch[branch]||0,pct=limit>0?used/limit*100:0;card.querySelector('[data-used]').textContent=money(used);card.querySelector('[data-available]').textContent=money(Math.max(0,limit-used));card.querySelector('[data-percent]').textContent=`${pct.toFixed(1).replace('.',',')} %`;const bar=card.querySelector('[data-progress]');bar.style.width=`${Math.min(100,pct)}%`;bar.style.background=pct>=100?'#f10d18':pct>=80?'#f0a000':'#14964f'}
    async function load(){try{const database=firestore();const [config,orders]=await Promise.all([database.collection('configuracion').doc('pedidos').get(),database.collection('pedidos').get()]);const limits=configuredLimits(config.exists?config.data():{});usedByBranch={progreso_ruta:0,calle5_espana:0};const month=currentMonth();orders.docs.forEach(doc=>{const order=doc.data()||{},branch=orderBranch(order);if(branch&&order.confirmado&&monthKey(order.fecha)===month)usedByBranch[branch]+=Number(order.total||0)||0});BRANCHES.forEach(branch=>{inputFor(branch).value=money(limits[branch]);paint(branch,limits[branch])})}catch(error){console.warn(error);els.message.textContent='No se pudo cargar la configuración.';els.message.className='message error'}}
    async function save(){const limits=Object.fromEntries(BRANCHES.map(branch=>[branch,parseMoney(inputFor(branch).value)]));const invalid=BRANCHES.find(branch=>!(limits[branch]>0));if(invalid){els.message.textContent='Ingresá un límite mayor a cero para cada sucursal.';els.message.className='message error';inputFor(invalid).focus();return}els.save.disabled=true;els.message.textContent='Guardando...';try{let user={};try{user=JSON.parse(localStorage.getItem('corralon_menu_active_user_snapshot_v1')||'{}')}catch{}await firestore().collection('configuracion').doc('pedidos').set({limitesMensuales:limits,limiteMensualProgresoRuta:limits.progreso_ruta,limiteMensualCalle5Espana:limits.calle5_espana,updatedAt:Date.now(),updatedById:String(user.id||''),updatedByName:String(user.nombre||user.usuario||'')},{merge:true});BRANCHES.forEach(branch=>{inputFor(branch).value=money(limits[branch]);paint(branch,limits[branch])});els.message.textContent='Configuración guardada por sucursal.';els.message.className='message ok'}catch(error){console.warn(error);els.message.textContent='No se pudo guardar la configuración.';els.message.className='message error'}finally{els.save.disabled=false}}
    BRANCHES.forEach(branch=>{const input=inputFor(branch);input.addEventListener('focus',()=>input.select());input.addEventListener('blur',()=>{const value=parseMoney(input.value);if(value>0)input.value=money(value)});input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();save()}})});
    els.save.addEventListener('click',save);
    load();
  </script>
</body>
</html>
