<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proveedores · Corralón Progreso</title>
<link rel="icon" href="favicon.png"><link rel="stylesheet" href="theme-corralon.css">
<style>
body{margin:0;font:14px Arial,sans-serif;background:var(--corralon-bg);color:var(--corralon-text)}main{max-width:960px;margin:auto;padding:12px}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0}header label{display:flex;gap:8px;align-items:center;flex:1}header input{width:100%}button,input,textarea{font:inherit}input,textarea{box-sizing:border-box;width:100%;min-width:0;padding:4px 6px;border:1px solid var(--corralon-line-strong);background:var(--corralon-white)}button{padding:8px 16px;cursor:pointer}fieldset{border:1px solid var(--corralon-line-strong);padding:14px}label{display:flex;align-items:center;gap:4px;white-space:nowrap}label input,label textarea{flex:1}input[type=checkbox]{width:auto;flex:none;accent-color:var(--corralon-red)}.fields{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 8px}.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}.w8{grid-column:span 8}.gains{margin:10px auto;width:75%;box-sizing:border-box;display:flex;gap:14px;align-items:center}.gains label{flex:1}.gains input:not([type=checkbox]){width:65px}.actions{display:flex;justify-content:center;gap:12px;padding:12px}.primary{background:var(--corralon-red);color:white}#status{min-height:20px}#lookupMenu{display:none;position:fixed;z-index:2000;max-height:280px;overflow:auto;box-sizing:border-box;background:var(--corralon-white);border:1px solid var(--corralon-line-strong);border-radius:8px;box-shadow:var(--corralon-shadow)}#lookupMenu.visible{display:block}.lookup-option{display:grid;grid-template-columns:85px minmax(0,1fr);gap:8px;padding:7px 9px;cursor:pointer;min-height:31px;box-sizing:border-box;border-bottom:1px solid var(--corralon-line)}#lookupMenu .lookup-option.active{background:var(--corralon-red)!important;color:#fff!important}.lookup-wrap{display:flex;flex:1;min-width:0}.lookup-wrap button{padding:2px 7px;border:1px solid var(--corralon-line-strong)}input[readonly]{background:var(--corralon-soft)}#user{font-size:12px}details{margin-top:12px}#initialBalance{max-width:160px}@media(max-width:700px){main{min-width:800px}.gains{width:90%}}@media print{header button,.actions,#status,#user,details,#lookupMenu{display:none}fieldset:disabled{opacity:1}main{padding:0}}
</style>
<script src="funciones.js" defer></script><script src="menu-auth-guard.js" data-menu-guard="proveedores_sql" defer></script>
</head>
<body data-page-theme="proveedores-sql">
<main>
<header><h1>Proveedores</h1><label>Buscar proveedor:<input id="search" data-list="proveedores" autocomplete="off"></label><button id="report" type="button">Informe</button><button id="close" type="button">Cerrar</button></header>
<form id="providerForm">
<fieldset id="fields"><div class="fields">
<label class="w2">ID:<input id="id" readonly tabindex="-1"></label><label class="w8">Razón Social:<input id="nombre" maxlength="100" required data-flow></label><label class="w2">Suspendido:<input id="suspendido" type="checkbox" data-flow></label>
<label class="w5">Contacto:<input id="contacto" maxlength="25" data-flow></label><label class="w7">Telef. del Contacto:<input id="telefonoContacto" maxlength="50" data-flow></label>
<label class="w12" style="grid-column:span 12">Dirección:<input id="direccion" maxlength="100" data-flow></label>
<label class="w5">Localidad:<input id="localidad" maxlength="50" data-flow></label><label class="w7">Provincia:<input id="provincia" data-list="provincias" data-flow required></label>
<label class="w4">Código Postal:<input id="codigoPostal" maxlength="30" data-flow></label><label class="w4">Teléfonos:<input id="telefonos" maxlength="75" data-flow></label><label class="w4">Celular:<input id="celular" maxlength="50" data-flow></label>
<label class="w6">Tipo de IVA:<input id="tipoIva" data-list="tiposIva" data-flow required></label><label class="w6">CUIT:<input id="cuit" maxlength="13" data-flow placeholder="00-00000000-0"></label>
<label class="w4">Ing. Brutos:<input id="tipoIb" data-list="tiposIb" data-flow required></label><label class="w3">Nº IIBB:<input id="nroIibb" maxlength="15" data-flow></label><label class="w5">Bancos:<input id="bancos" data-flow></label>
<label class="w6">Email:<input id="email" maxlength="150" data-flow></label><label class="w6">Web:<input id="web" maxlength="150" data-flow></label>
<label class="w7">Proveedor de:<input id="tipoProveedor" data-list="tiposProveedor" data-flow required></label><label class="w5" style="grid-row:span 2">Nota:<textarea id="nota" rows="3" maxlength="10000" data-flow></textarea></label>
<label class="w3">Tipo de Bien:<input id="tipoBien" data-list="tiposBien" data-flow required></label><label class="w4">Cuenta:<input id="cuenta" data-list="cuentas" data-flow required></label>
</div></fieldset>
<fieldset class="gains" id="gainFields"><legend>Porcentaje de Ganancias</legend><label>% Gan. Prov.:<input id="gananciasProveedor" type="checkbox" data-flow></label><label>Mayorista:<input id="gananciaMayorista" inputmode="decimal" data-number-format="percent" data-flow></label><label>Intermedio:<input id="gananciaIntermedio" inputmode="decimal" data-number-format="percent" data-flow></label><label>Minorista:<input id="gananciaMinorista" inputmode="decimal" data-number-format="percent" data-flow></label></fieldset>
<details id="additional" hidden><summary>Datos adicionales conservados en SQL</summary><label>Saldo inicial:<input id="initialBalance" readonly></label><p id="additionalInfo"></p></details>
<div class="actions"><button id="save" class="primary" type="submit">Guardar</button><button id="add" type="button">Agregar</button><button id="remove" type="button">Eliminar</button><button id="modify" type="button">Modificar</button><button id="previous" type="button" aria-label="Proveedor anterior">◀</button><button id="next" type="button" aria-label="Proveedor siguiente">▶</button></div>
</form><div id="user"></div><p id="status" role="status" aria-live="polite">Validando usuario…</p>
</main><div id="lookupMenu" role="listbox"></div>
<dialog id="providerReport" style="width:min(1100px,95vw);max-height:90vh"><header><h1>Informe de proveedores</h1><button type="button" onclick="window.print()">Imprimir</button><button type="button" onclick="this.closest('dialog').close()">Cerrar</button></header><table style="width:100%;border-collapse:collapse"><thead><tr><th>ID</th><th>Razón Social</th><th>CUIT</th><th>Dirección</th><th>Localidad</th><th>Teléfono</th><th>Suspendido</th></tr></thead><tbody></tbody></table></dialog>
<style>#providerReport th,#providerReport td{padding:6px;text-align:left;border-bottom:1px solid var(--corralon-line)}@media print{body:has(#providerReport[open]) main{display:none}#providerReport[open]{position:static;max-height:none;width:100%;border:0;padding:0;overflow:visible}#providerReport::backdrop{background:white}}</style>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id), FX = window.CorralonFunciones, params = new URLSearchParams(location.search);
  const textFields = ['nombre','contacto','telefonoContacto','direccion','localidad','codigoPostal','telefonos','celular','cuit','nroIibb','bancos','email','web','nota'];
  const lookupFields = ['provincia','tipoIva','tipoIb','tipoProveedor','tipoBien','cuenta'];
  const margins = ['gananciaMayorista','gananciaIntermedio','gananciaMinorista'];
  const columns = {nombre:'RazónSocial',contacto:'Contacto',telefonoContacto:'TelContacto',direccion:'Dirección',localidad:'Localidad',codigoPostal:'CodPostal',telefonos:'Teléfono',celular:'Celular',cuit:'CUIT',nroIibb:'NroIIBB',bancos:'Bancos',email:'Email',web:'Web',nota:'Nota',provincia:'Provincia',tipoIva:'IDTipoIVA',tipoIb:'IDTipoIB',tipoProveedor:'IDTipoProv',tipoBien:'IDTipoBien',cuenta:'CodCta',gananciaMayorista:'PorcGan1',gananciaIntermedio:'PorcGan2',gananciaMinorista:'PorcGan3'};
  let actor, catalog, currentId = 0, version = '', pending = null, ready = false;
  let lookup = { input: null, items: [], active: 0 };
  const normalize = value => String(value ?? '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const label = item => `${item.nombre} · ${item.id}`;
  const key = () => `corralon_proveedor_pendiente_v1:${actor.id}`;
  FX.bindCuit($('cuit'));
  function updateCuitRequirement() { $('cuit').required = false; }
  $('tipoIva').addEventListener('change', updateCuitRequirement);
  const status = message => { $('status').textContent = message; };
  function items(input) { return catalog?.[input.dataset.list] || []; }
  function choice(input) { const query=normalize(input.value), list=items(input); const exact=list.find(item=>normalize(label(item))===query); if(exact)return exact; const matches=list.filter(item=>normalize(item.id)===query||normalize(item.nombre)===query); return matches.length===1?matches[0]:null; }
  function setChoice(id, value) { const item=items($(id)).find(item=>String(item.id)===String(value)); $(id).value=item?label(item):''; if(id==='tipoIva')updateCuitRequirement(); }
  async function api(query, body) {
    const url=new URL('/api/facturacion/proveedores-sql',location.href); url.searchParams.set('usuarioId',actor.id);
    Object.entries(query||{}).forEach(([key,value])=>url.searchParams.set(key,value));
    const response=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});
    const data=await response.json(); if(!response.ok||!data.ok){const error=new Error(data.error||'No se pudo consultar SQL.');error.definitive=response.status>=400&&response.status<500;throw error;} return data;
  }
  function freeze(editing) { $('fields').disabled=!editing; $('gainFields').disabled=!editing; $('save').disabled=!editing&&!pending; $('modify').disabled=Boolean(pending)||!currentId; ['add','remove','previous','next'].forEach(id=>$(id).disabled=Boolean(pending)); $('search').disabled=Boolean(pending); }
  function hideLookup(){if(lookup.input)lookup.input.setAttribute('aria-expanded','false');$('lookupMenu').classList.remove('visible');lookup={input:null,items:[],active:0};}
  function markLookup(){const menu=$('lookupMenu');menu.querySelectorAll('[data-option]').forEach(row=>{const active=Number(row.dataset.option)===lookup.active;row.classList.toggle('active',active);row.setAttribute('aria-selected',String(active));});const row=menu.querySelector(`[data-option="${lookup.active}"]`);if(row){menu.style.paddingBottom=`${Math.max(0,menu.clientHeight-row.offsetHeight)}px`;menu.scrollTop=row.offsetTop;}}
  function showLookup(input){if(input.disabled||!ready)return;const list=items(input),query=normalize(input.value);let index=list.findIndex(item=>normalize(label(item))===query||normalize(item.id)===query);if(index<0&&query)index=list.findIndex(item=>normalize(item.nombre).startsWith(query));if(index<0&&query)index=list.findIndex(item=>normalize(item.nombre).includes(query));lookup={input,items:list,active:Math.max(0,index)};const menu=$('lookupMenu');menu.innerHTML=list.map((item,i)=>`<div class="lookup-option" role="option" data-option="${i}"><span>${esc(item.id)}</span><span>${esc(item.nombre)}</span></div>`).join('');const rect=input.getBoundingClientRect();menu.style.width=`${Math.min(Math.max(rect.width,450),window.innerWidth-16)}px`;menu.style.left=`${Math.max(8,Math.min(rect.left,window.innerWidth-parseFloat(menu.style.width)-8))}px`;menu.style.maxHeight=`${Math.max(40,Math.min(280,window.innerHeight-rect.bottom-12))}px`;menu.style.top=`${rect.bottom+2}px`;menu.style.paddingBottom='0px';menu.classList.add('visible');input.setAttribute('aria-expanded','true');markLookup();}
  function pickLookup(){const input=lookup.input,item=lookup.items[lookup.active];if(!input||!item||!input.value.trim())return false;input.value=label(item);hideLookup();input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));input.focus();hideLookup();return true;}
  document.querySelectorAll('input[data-list]').forEach(input=>{const wrap=document.createElement('span');wrap.className='lookup-wrap';input.before(wrap);wrap.append(input);input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-controls','lookupMenu');const button=document.createElement('button');button.type='button';button.className='lookup-drop';button.tabIndex=-1;button.textContent='▾';button.setAttribute('aria-label','Desplegar lista');wrap.append(button);});
  FX.bindDropdownOnlyWhenTyping({root:document,inputSelector:'input[data-list]',buttonSelector:'.lookup-drop',show:showLookup,hide:hideLookup,isOpen:input=>lookup.input===input,moveActive:(_,step)=>{lookup.active=Math.max(0,Math.min(lookup.items.length-1,lookup.active+step));markLookup();},pickActive:pickLookup,openOnTyping:true,buttonOnlyWhenFocused:false});
  document.addEventListener('keydown',event=>{const input=event.target.closest('input[data-list]');if(!input)return;if(event.key==='F4'){event.preventDefault();if(lookup.input===input)hideLookup();else showLookup(input);}else if((event.key==='Enter'||event.key==='Tab')&&!event.shiftKey){if(lookup.input!==input&&input.value.trim())showLookup(input);if(lookup.input===input)pickLookup();hideLookup();if(event.key==='Enter'&&!input.hasAttribute('data-flow'))event.preventDefault();}else if(event.key==='Tab')hideLookup();},true);
  $('lookupMenu').addEventListener('pointerdown',event=>{const row=event.target.closest('[data-option]');if(row){event.preventDefault();lookup.active=Number(row.dataset.option);pickLookup();}});
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('.lookup-wrap')&&!$('lookupMenu').contains(event.target))hideLookup();});
  window.addEventListener('resize',hideLookup);document.addEventListener('scroll',event=>{if(!$('lookupMenu').contains(event.target))hideLookup();},true);
  FX.bindLinearNavigation({root:$('providerForm'),selector:'[data-flow]',selectOnAnyFocus:true,selectOnFirstPointerFocus:true,navigateLeftRight:true,smartCaret:true});FX.bindFieldRestore({root:$('providerForm')});FX.bindLiveLocaleNumber({root:$('providerForm'),selector:'[data-number-format="percent"]',decimals:2,selectOnFocus:false,preserveEmpty:true});
  function populate(provider){currentId=Number(provider.IDProveedor)||0;$('id').value=currentId||catalog.siguienteId;textFields.forEach(id=>$(id).value=provider[columns[id]]||'');lookupFields.forEach(id=>setChoice(id,provider[columns[id]]));margins.forEach(id=>$(id).value=FX.formatLocaleNumber(Number(provider[columns[id]]||0)*100,{decimals:2}));$('suspendido').checked=Boolean(provider.Suspendido);$('gananciasProveedor').checked=Boolean(provider.PorcProv);$('additional').hidden=!currentId;$('initialBalance').value=FX.formatCurrencyText(Number(provider.SaldoIni||0));$('additionalInfo').textContent=`Alta: ${provider.FechaAlta||'—'} · Fax: ${provider.Fax||'—'} · Vencimiento exención IIBB: ${provider.FechaVtoExIB||'—'} · Descuento: ${FX.formatLocaleNumber(Number(provider.PorcDto||0)*100)}%`;$('search').value=currentId?`${provider['RazónSocial']} · ${currentId}`:'';}
  function newProvider(name=''){if(pending)return;version='';populate({RazónSocial:name.toUpperCase(),Provincia:10,IDTipoIVA:1,IDTipoIB:1,IDTipoProv:1,IDTipoBien:1,CodCta:'113101',PorcGan1:.35,PorcGan2:.45,PorcGan3:.55});freeze(true);$('nombre').focus();status('Nuevo proveedor. El ID definitivo se asigna al guardar en SQL.');}
  async function loadProvider(id){if(pending)return;try{const data=await api({consulta:'detalle',id});version=data.version;populate(data.proveedor);freeze(false);status('Proveedor consultado en SQL. Usá Modificar para editar.');}catch(error){status(error.message);}}
  function dataForSave(){const data={accion:'guardar',solicitud:crypto.randomUUID(),usuarioId:actor.id,id:currentId,version};textFields.forEach(id=>data[id]=$(id).value.trim());lookupFields.forEach(id=>{const item=choice($(id));if(!item)throw new Error(`Seleccioná ${$(id).closest('label').childNodes[0].textContent} de la lista SQL.`);data[id]=item.id;});margins.forEach(id=>data[id]=FX.parseLocaleNumber($(id).value)/100);data.suspendido=$('suspendido').checked;data.gananciasProveedor=$('gananciasProveedor').checked;return data;}
  async function send(payload){pending=payload;localStorage.setItem(key(),JSON.stringify(pending));freeze(false);$('save').disabled=true;status('Guardando en SQL…');try{const result=await api({},pending);pending=null;localStorage.removeItem(key());if(result.proveedor){catalog.proveedores=catalog.proveedores.filter(item=>Number(item.id)!==Number(result.proveedor.IDProveedor));catalog.proveedores.push({id:result.proveedor.IDProveedor,nombre:result.proveedor['RazónSocial'],cuit:result.proveedor.CUIT,suspendido:result.proveedor.Suspendido,contacto:result.proveedor.Contacto,direccion:result.proveedor['Dirección'],localidad:result.proveedor.Localidad,telefono:result.proveedor['Teléfono'],email:result.proveedor.Email});catalog.proveedores.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));catalog.siguienteId=Math.max(Number(catalog.siguienteId),Number(result.proveedor.IDProveedor)+1);}else{catalog.proveedores=catalog.proveedores.filter(item=>Number(item.id)!==Number(result.eliminado));}if(result.proveedor){version=result.version;populate(result.proveedor);freeze(false);status('Proveedor guardado en SQL.');if(parent!==window)parent.postMessage({type:'corralon-proveedor-guardado',id:result.proveedor.IDProveedor},location.origin);}else{newProvider();status('Proveedor eliminado.');}}catch(error){if(error.definitive){pending=null;localStorage.removeItem(key());freeze(payload.accion==='guardar');}else{freeze(false);$('save').textContent='Reintentar';}status(error.message+(pending?' · La solicitud quedó pendiente; reintentá sin crear otro proveedor.':''));}finally{$('save').disabled=!pending&&$('fields').disabled;}}
  $('providerForm').addEventListener('submit',event=>{event.preventDefault();if(pending){send(pending);return;}try{send(dataForSave());}catch(error){status(error.message);}});
  $('nombre').addEventListener('blur',()=>{$('nombre').value=$('nombre').value.trim().toUpperCase();});
  $('search').addEventListener('change',()=>{const item=choice($('search'));if(item)loadProvider(item.id);else status('Seleccioná un proveedor o pulsá Agregar.');});
  $('add').onclick=()=>newProvider();$('modify').onclick=()=>{freeze(true);$('nombre').focus();};
  $('remove').onclick=()=>{if(!currentId)return;if(confirm(`¿Eliminar el proveedor ${$('nombre').value}?`))send({accion:'eliminar',solicitud:crypto.randomUUID(),usuarioId:actor.id,id:currentId,version});};
  function navigate(step){if(pending)return;const list=catalog.proveedores,index=list.findIndex(item=>Number(item.id)===currentId),item=list[index+step];if(item)loadProvider(item.id);}
  $('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);$('report').onclick=()=>{if(!catalog)return;const report=$('providerReport');report.querySelector('tbody').innerHTML=catalog.proveedores.map(item=>'<tr>'+[item.id,item.nombre,item.cuit,item.direccion,item.localidad,item.telefono,item.suspendido?'Sí':'No'].map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>').join('');report.showModal();};$('close').onclick=()=>{if(parent!==window)parent.postMessage({type:'corralon-proveedor-cerrar'},location.origin);else location.href='menu.html';};
  async function initialize(user){if(ready||!user?.id)return;actor=user;$('user').textContent=`Usuario: ${user.nombre||user.usuario}`;try{catalog=await api({consulta:'opciones'});ready=true;try{pending=JSON.parse(localStorage.getItem(key())||'null');}catch{}if(pending){const waiting=pending;pending=null;if(waiting.id)await loadProvider(waiting.id);else newProvider();pending=waiting;currentId=pending.id;$('id').value=currentId||catalog.siguienteId;version=pending.version;for(const id of textFields)if(pending[id]!=null)$(id).value=pending[id];lookupFields.forEach(id=>setChoice(id,pending[id]));margins.forEach(id=>$(id).value=FX.formatLocaleNumber(Number(pending[id]||0)*100));$('suspendido').checked=Boolean(pending.suspendido);$('gananciasProveedor').checked=Boolean(pending.gananciasProveedor);freeze(false);$('save').textContent='Reintentar';status('Hay una solicitud pendiente. Reintentá para verificar el resultado en SQL.');}else if(params.get('id'))await loadProvider(params.get('id'));else newProvider(params.get('nombre')||'');}catch(error){status(error.message);}}
  window.addEventListener('menu-user-validated',event=>initialize(event.detail.user));if(document.documentElement.style.visibility!=='hidden')initialize(FX.menuSessionUser());
});
</script>
</body></html>
