function percentInput(value){return CorralonFunciones.formatLocaleNumber(Number(value||0)*100,{decimals:2,suffix:' %'})}
function boolInput(value){if(typeof value==='boolean')return value;const text=norm(value);return ['-1','1','true','si','sí','yes','x'].includes(text)}
function providerUpdatedDisplay(p){const value=p?.updated_at||p?.ultima_actualizacion||'';if(!value)return'';const d=new Date(String(value).replace(' ','T'));return Number.isNaN(d.getTime())?String(value):d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function providerDateStatus(p){const value=p?.updated_at||p?.ultima_actualizacion||'';if(!value)return'none';const d=new Date(String(value).replace(' ','T'));if(Number.isNaN(d.getTime()))return'none';const days=(Date.now()-d.getTime())/86400000;if(days<=30)return'fresh';if(days<=60)return'warn';return'old'}
function providerStatusLabel(status){return status==='fresh'?'Lista al día':status==='warn'?'Por vencer':status==='old'?'Vencida':'Sin actualizar'}
function providerCell(row,col,content,extra=''){return `<div class="access-cell ${extra}" tabindex="0" data-row="${row}" data-col="${col}">${content}</div>`}
function sortValue(p,key){if(key==='id')return Number(p.id_proveedor)||String(p.id_proveedor||'');if(key==='desc_factura')return Number(p.descuento_factura||0);if(key==='desc_final_factura')return Number(p.descuento_total_fc||0);if(key==='desc_lista')return Number(p.descuento_lista||0);if(key==='ultima')return new Date(String(p.updated_at||p.ultima_actualizacion||'').replace(' ','T')).getTime()||0;if(key==='vendedor')return norm(p.vendedor);if(key==='telefono')return norm(p.telefono);return norm(p.proveedor)}
function compareProviders(a,b){if(!sortState.key)return 0;const va=sortValue(a,sortState.key),vb=sortValue(b,sortState.key);let result=0;if(typeof va==='number'&&typeof vb==='number')result=va-vb;else result=String(va).localeCompare(String(vb),'es',{numeric:true,sensitivity:'base'});return sortState.dir==='desc'?-result:result}

function renderMetrics(){
  const counts={fresh:0,warn:0,old:0,none:0};
  providerRows.forEach(p=>counts[providerDateStatus(p)]++);
  metricFresh.textContent=counts.fresh.toLocaleString('es-AR');
  metricWarn.textContent=counts.warn.toLocaleString('es-AR');
  metricOld.textContent=counts.old.toLocaleString('es-AR');
  metricNone.textContent=counts.none.toLocaleString('es-AR');
}

function render(){
  const search=norm(el.search.value);
  const dateFilter=activeStatusFilter;
  filtered=providerRows.filter(p=>{
    const haystack=norm(`${p.id_proveedor||''} ${p.proveedor||''} ${p.vendedor||''} ${p.telefono||''} ${p.nota||''}`);
    const status=providerDateStatus(p);
    return(!search||haystack.includes(search))&&(!dateFilter||dateFilter==='all'||status===dateFilter);
  }).sort(compareProviders);
  if(selectedProviderId!==null&&!filtered.some(p=>String(p.id_proveedor)===String(selectedProviderId)))selectedProviderId=null;
  if(selectedProviderId===null&&filtered.length)selectedProviderId=filtered[0].id_proveedor;
  el.rows.innerHTML=filtered.map((p,row)=>{
    const status=providerDateStatus(p);
    const selected=String(p.id_proveedor)===String(selectedProviderId);
    const hasPage=Boolean(providerPage(p));
    return `<div class="row ${selected?'is-current-provider':''}" data-id="${escapeHtml(p.id_proveedor)}">
      ${providerCell(row,0,`<div class="provider-main"><span class="provider-name${hasPage?' has-page':''}">${escapeHtml(p.proveedor)}</span><span class="provider-id">ID ${escapeHtml(p.id_proveedor)}</span></div>`,'provider-main')}
      ${providerCell(row,1,`<div class="commercial-line"><span>Precio unit. ${money(p.descuento_factura)}</span><span class="commercial-dot">•</span><span>Pronto pago ${money(p.descuento_total_fc)}</span><span class="commercial-dot">•</span><span>Lista ${money(p.descuento_lista)}</span></div><div class="commercial-secondary">Flete ${money(p.porc_flete)} · IVA incluido: ${boolInput(p.iva_incluido)?'Sí':'No'}</div>`,'commercial')}
      ${providerCell(row,2,`<div class="update-main"><span class="status-badge ${status}">${providerStatusLabel(status)}</span><span class="update-date">${escapeHtml(providerUpdatedDisplay(p)||'Sin fecha')}</span></div>`,'update-main')}
      ${providerCell(row,3,`<div class="contact-main"><span class="contact-person">${escapeHtml(p.vendedor||'Sin asignar')}</span><span class="contact-phone">${escapeHtml(p.telefono||'Sin teléfono')}</span></div>`,'contact-main')}
      <div class="row-actions"><button class="row-menu" type="button" data-edit="${escapeHtml(p.id_proveedor)}" title="Editar proveedor">⋮</button></div>
    </div>`;
  }).join('');
  const countText=`${filtered.length.toLocaleString('es-AR')} / ${providerRows.length.toLocaleString('es-AR')} proveedores`;
  el.status.textContent=countText;
  el.tableStatus.textContent=filtered.length===providerRows.length?`${providerRows.length.toLocaleString('es-AR')} proveedores`:`Mostrando ${countText}`;
  document.querySelectorAll('.metric-card[data-status-filter]').forEach(btn=>btn.classList.toggle('is-filtering',btn.dataset.statusFilter===activeStatusFilter));
  renderMetrics();
  renderDetail();
}
function applyProviderColumnWidths(){document.documentElement.style.setProperty('--provider-grid-columns',providerColumnWidths.map(w=>`${Math.max(44,Number(w)||80)}px`).join(' '))}
function initProviderColumnResize(){
  const table=document.getElementById('providersTable');
  if(!localStorage.getItem(PROVIDER_COL_WIDTHS_KEY)){
    const available=Math.max(760,table.clientWidth-16), actionWidth=44, contentWidth=available-actionWidth;
    const fitted=[contentWidth*.27,contentWidth*.34,contentWidth*.18,contentWidth*.21,actionWidth];
    fitted.forEach((width,index)=>providerColumnWidths[index]=Math.round(width));
  }
  CorralonFunciones.bindResizableColumns({root:table,widths:providerColumnWidths,storageKey:PROVIDER_COL_WIDTHS_KEY,apply:applyProviderColumnWidths});
}

  providerContextMenu.style.top=`${Math.max(6,Math.min(y,window.innerHeight-rect.height-6))}px`;

async function saveProvider(provider,originalId=null){const localProvider=CorralonSystem.normalizeProviderPageLink(provider);const idChanged=originalId!==null&&String(originalId)!==String(localProvider.id_proveedor);if(idChanged&&providerRows.some(p=>String(p.id_proveedor)===String(localProvider.id_proveedor)))throw new Error('El ID de proveedor ya existe');const url=idChanged?`${SUPABASE_URL}/rest/v1/${TABLE}?id_proveedor=eq.${encodeURIComponent(originalId)}`:`${SUPABASE_URL}/rest/v1/${TABLE}?on_conflict=id_proveedor`;const response=await fetch(url,{method:idChanged?'PATCH':'POST',headers:headers({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(CorralonSystem.providerRemotePayload(localProvider))});if(!response.ok)throw new Error(await response.text());const index=providerRows.findIndex(p=>String(p.id_proveedor)===String(idChanged?originalId:localProvider.id_proveedor));if(index>=0)providerRows[index]=localProvider;else providerRows.push(localProvider);selectedProviderId=localProvider.id_proveedor;providerRows.sort((a,b)=>String(a.proveedor||'').localeCompare(String(b.proveedor||''),'es'));await CorralonSystem.setProvidersCache(providerRows.map(CorralonSystem.normalizeProviderPageLink));refreshSellerOptions();render()}

deleteProviderBtn.addEventListener('click',async()=>{const id=editingProviderId;if(id===null)return;const current=providerRows.find(p=>String(p.id_proveedor)===String(id));if(!confirm(`¿Eliminar el proveedor ${current?.proveedor||id}?`))return;try{el.status.textContent='Eliminando proveedor...';const response=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id_proveedor=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:headers({Prefer:'return=minimal'})});if(!response.ok)throw new Error(await response.text());providerRows=providerRows.filter(p=>String(p.id_proveedor)!==String(id));if(String(selectedProviderId)===String(id))selectedProviderId=null;await CorralonSystem.setProvidersCache(providerRows.map(CorralonSystem.normalizeProviderPageLink));closeProviderModal();refreshSellerOptions();render();el.status.textContent='Proveedor eliminado'}catch(error){console.error(error);el.status.textContent=error.message||'Error eliminando proveedor'}});

document.addEventListener('keydown',(event)=>{
  if(event.defaultPrevented)return;
  if(event.key!=='F2')return;
  const input=document.activeElement;
  if(!input||!input.matches('input[type="text"], input:not([type]), input[type="date"], textarea'))return;
  event.preventDefault();
  const value=String(input.value??'');
  const start=input.selectionStart??0;
  const end=input.selectionEnd??0;
  const allSelected=value.length>0&&start===0&&end===value.length;
  if(allSelected){
    const pos=value.length;
    input.setSelectionRange(pos,pos);
  }else{
    input.select();
  }
});
