<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Pedido compartido · Corralón Progreso</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/theme-corralon.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/presupuesto-shared.js"></script>
  <style>
    :root{color-scheme:light;--red:#ed111c;--ink:#171717;--muted:#696969;--line:#d8d8d5;--soft:#f4f4f2}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#f3f3f1;color:var(--ink);font-family:Barlow,Arial,sans-serif}
    body{padding:18px}
    .page{width:min(980px,100%);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 15px 42px rgba(0,0,0,.12);overflow:hidden}
    .head{display:flex;align-items:center;gap:18px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
    .head img{width:132px;height:auto;object-fit:contain}
    .head-title{min-width:0;flex:1}
    h1{margin:0;font:900 30px/1 'Barlow Condensed',Barlow,Arial,sans-serif;text-transform:uppercase}
    .readonly{display:inline-flex;margin-top:7px;padding:4px 9px;border:1px solid #f2aaa9;border-radius:999px;background:#fff0f0;color:#c6141c;font-size:12px;font-weight:800}
    .meta{display:grid;grid-template-columns:110px minmax(220px,1fr) 190px 150px;gap:8px;padding:12px;background:var(--soft);border-bottom:1px solid var(--line)}
    .meta>div{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .meta span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
    .meta strong{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
    .content{padding:12px}
    .table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .row{display:grid;grid-template-columns:minmax(130px,20%) minmax(0,1fr) 110px;min-height:39px;border-bottom:1px solid #e7e7e4;align-items:center}
    .row:last-child{border-bottom:0}
    .row.head-row{min-height:36px;background:#e9e9e6;font-family:'Barlow Condensed',Barlow,Arial,sans-serif;font-weight:900}
    .row>div{min-width:0;padding:8px 10px;overflow-wrap:anywhere}
    .row>div+div{border-left:1px solid #e1e1de}
    .qty{text-align:right;font-weight:900}
    .actions{display:flex;justify-content:flex-end;gap:10px;padding:12px 0 0}
    button{min-height:40px;padding:8px 16px;border:1px solid #bdbdb9;border-radius:10px;background:#fff;color:var(--ink);font:800 15px Barlow,Arial,sans-serif;cursor:pointer}
    button.primary{border-color:var(--red);background:var(--red);color:#fff}
    button:disabled{opacity:.45;cursor:not-allowed}
    .state{padding:54px 18px;text-align:center;color:var(--muted);font-weight:800}
    .spinner{width:42px;height:42px;margin:0 auto 14px;border:4px solid #f3c7c9;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:650px){
      body{padding:0;background:#fff}.page{min-height:100dvh;border:0;border-radius:0;box-shadow:none}
      .head{padding:11px 12px;gap:11px}.head img{width:96px}h1{font-size:24px}
      .meta{grid-template-columns:82px minmax(0,1fr) 118px;padding:7px;gap:5px}.meta>div{padding:6px 7px}.meta>div:nth-child(2){grid-column:2/4}.meta>div:nth-child(3){grid-column:1/3}.meta>div:nth-child(4){grid-column:3}.meta strong{font-size:14px}
      .content{padding:6px}.table{border-radius:8px}.row{grid-template-columns:29% minmax(0,1fr) 58px;min-height:34px;font-size:13px}.row.head-row{min-height:31px}.row>div{padding:6px 5px}
      .actions{position:sticky;bottom:0;padding:7px 0;background:#fff}.actions button{flex:1;padding:7px 5px;font-size:14px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="head">
      <img src="/logo-corralon.png" alt="Corralón Progreso">
      <div class="head-title"><h1 id="title">Pedido compartido</h1><span class="readonly">Solo lectura</span></div>
    </header>
    <section id="loading" class="state"><div class="spinner"></div>Cargando pedido…</section>
    <section id="error" class="state" hidden></section>
    <section id="order" hidden>
      <div class="meta">
        <div><span>Pedido</span><strong id="number"></strong></div>
        <div><span>Proveedor</span><strong id="provider"></strong></div>
        <div><span>Sucursal</span><strong id="branch"></strong></div>
        <div><span>Fecha</span><strong id="date"></strong></div>
      </div>
      <div class="content">
        <div class="table">
          <div class="row head-row"><div>Código</div><div>Descripción</div><div class="qty">Cantidad</div></div>
          <div id="rows"></div>
        </div>
        <div class="actions">
          <button id="excel" type="button">Descargar Excel</button>
          <button class="primary" id="pdf" type="button">Descargar PDF</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    (()=>{
      const FIREBASE_CONFIG={apiKey:'AIzaSyCxwUGX-rVusOI13j7oTfQuAtkeNXdAYH0',authDomain:'corralon-progreso.firebaseapp.com',projectId:'corralon-progreso',storageBucket:'corralon-progreso.firebasestorage.app',messagingSenderId:'466583614632',appId:'1:466583614632:web:42cb839f83e97475fabe9d'};
      const $=selector=>document.querySelector(selector);
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const providerName=value=>String(value||'').replace(/^\s*\d+\s*[-–]\s*/,'').trim();
      const branchName=value=>({progreso_ruta:'Suc. Progreso y Ruta',calle5_espana:'Suc. Calle 5 y España'}[String(value||'').trim()]||String(value||'').trim()||'Sin sucursal');
      const safeFile=value=>String(value||'Pedido').replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim()||'Pedido';
      const slug=()=>decodeURIComponent(new URLSearchParams(location.search).get('pedido')||location.pathname.replace(/\/+$/,'').split('/').pop()||'').trim().toLowerCase();
      let order=null;
      function visibleRows(){return(Array.isArray(order?.detalles)?order.detalles:[]).filter(row=>String(row?.codProv||row?.articulo||row?.cantidad||'').trim()).map(row=>({codigo:String(row.codProv||''),descripcion:String(row.articulo||''),cantidad:row.cantidad??''}))}
      function showError(message){$('#loading').hidden=true;$('#order').hidden=true;$('#error').hidden=false;$('#error').textContent=message}
      function render(){const rows=visibleRows(),provider=providerName(order.proveedor)||'Sin proveedor',number=String(order.id||'').replace(/__user_.*$/,'');document.title=`Pedido ${number} · ${provider}`;$('#title').textContent=`Pedido ${number}`;$('#number').textContent=number;$('#provider').textContent=provider;$('#branch').textContent=branchName(order.sucursalId||order.sucursal);$('#date').textContent=String(order.fecha||'');$('#rows').innerHTML=rows.map(row=>`<div class="row"><div>${esc(row.codigo)}</div><div>${esc(row.descripcion)}</div><div class="qty">${esc(row.cantidad)}</div></div>`).join('')||'<div class="state">Este pedido no tiene artículos.</div>';$('#loading').hidden=true;$('#error').hidden=true;$('#order').hidden=false;$('#excel').disabled=!rows.length;$('#pdf').disabled=!rows.length}
      function downloadExcel(){const rows=visibleRows(),provider=providerName(order.proveedor)||'Sin proveedor',number=String(order.id||'');const data=[[`Pedido Nro ${number} - Sucursal: ${branchName(order.sucursalId||order.sucursal)}`],[],['codigo','articulos','cantidad'],...rows.map(row=>[row.codigo,row.descripcion,Number(row.cantidad)||row.cantidad])];const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:18},{wch:60},{wch:12}];ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:2}}];XLSX.utils.book_append_sheet(wb,ws,'Pedido');XLSX.writeFile(wb,`Pedido_${safeFile(provider)}_${safeFile(order.fecha)}.xlsx`)}
      async function downloadPdf(){const rows=visibleRows(),provider=providerName(order.proveedor)||'Sin proveedor';const logo=await PresupuestoShared.ensureLogoDataUrl('/logo-corralon.png');const doc=PresupuestoShared.generarPDFPedidoDoc({numero:order.id||'',fecha:order.fecha||'',proveedor,sucursal:branchName(order.sucursalId||order.sucursal),logoDataUrl:logo,items:rows.map(row=>({codigoProveedor:row.codigo,detalle:row.descripcion,cantidad:row.cantidad}))});doc.save(`Pedido_${safeFile(provider)}_${safeFile(order.fecha)}.pdf`)}
      async function init(){const shareSlug=slug();if(!shareSlug||shareSlug==='pedido-compartido'||shareSlug==='pedido-compartido.html'){showError('El enlace del pedido está incompleto: falta la clave. Volvé a copiarlo desde Pedidos.');return}try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);const snap=await firebase.firestore().collection('pedidos').where('shareSlug','==',shareSlug).limit(1).get();if(snap.empty){showError('Este enlace no existe o ya no está disponible.');return}const data=snap.docs[0].data()||{};if(data.eliminado||data.shareEnabled!==true||!data.confirmado){showError('Este pedido ya no está disponible.');return}order=data;render()}catch(error){console.warn(error);showError('No se pudo cargar el pedido. Revisá la conexión e intentá nuevamente.')}}
      $('#excel').addEventListener('click',()=>{try{downloadExcel()}catch(error){console.warn(error);alert('No se pudo generar el Excel.')}});
      $('#pdf').addEventListener('click',()=>downloadPdf().catch(error=>{console.warn(error);alert('No se pudo generar el PDF.')}));
      init();
    })();
  </script>
</body>
</html>
