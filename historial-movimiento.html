function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function norm(value) {
  return String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}
function money(value) {
  return `$ ${Number(value || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function htmlNotice(text, confirmation = true) {
  return new Promise(resolve => {
    const previous = document.activeElement;
    const dialog = document.createElement('dialog');
    dialog.className = 'html-notice';
    dialog.setAttribute('aria-label', confirmation ? 'Confirmar acción' : 'Aviso');
    dialog.style.cssText = 'width:min(460px,calc(100vw - 32px));max-height:90vh;padding:20px;border:1px solid #bbb;border-radius:10px;background:var(--corralon-white,#fff);color:var(--corralon-text,#222);box-shadow:0 12px 40px #0004';
    const title = document.createElement('h2');
    title.textContent = confirmation ? 'Confirmar acción' : 'Aviso';
    title.style.cssText = 'margin:0 0 14px;font-size:20px';
    const message = document.createElement('p');
    message.textContent = text;
    message.style.cssText = 'white-space:pre-wrap;margin:0 0 20px';
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;justify-content:flex-end;gap:10px';
    const accept = document.createElement('button');
    accept.type = 'button';
    accept.textContent = confirmation ? 'Confirmar' : 'Aceptar';
    accept.style.cssText = 'background:var(--corralon-red,#f50916);color:white;padding:9px 16px;border:0';
    const finish = accepted => { dialog.close(); dialog.remove(); previous?.focus(); resolve(accepted); };
    if (confirmation) {
      const cancel = document.createElement('button');
      cancel.type = 'button'; cancel.textContent = 'Cancelar';
      cancel.style.cssText = 'padding:9px 16px';
      cancel.onclick = () => finish(false);
      actions.append(cancel);
    }
    accept.onclick = () => finish(true);
    actions.append(accept);
    dialog.addEventListener('cancel', event => { event.preventDefault(); finish(false); });
    dialog.append(title, message, actions);
    document.body.append(dialog);
    dialog.showModal();
    accept.focus();
  });
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateText(value){return /^\d{4}-\d{2}-\d{2}$/.test(value)?value.split('-').reverse().join('/'):value;}

  if(previous||next){event.preventDefault();sarPendingWheel=Math.max(-16000,Math.min(16000,sarPendingWheel+delta));sarMaybeLoadMore();}
}

  async function openDetail(index){

  function closeDetail(){if(cancellationBusy)return;const wasOpen=!detail.hidden;if(sectionHost?.dataset.detailOpen==='true')notifyDetailSection(false);warrantyMenu.hidden=true;detailData=null;detail.hidden=true;detailSequence++;detailController?.abort();const body=detail.querySelector('[data-detail-body]'),footer=detail.querySelector('.invoice-history-footer');if(footer&&body.contains(footer))detail.querySelector('.invoice-history-card').appendChild(footer);body.textContent='';if(overlay.hidden)returnFocus?.focus();else get('[data-rows]').querySelector(`[data-invoice="${detailIndex}"]`)?.focus();if(wasOpen)detailOptions.onClose?.();}

  async function openList(){

<script id="history-print-bridge">(()=>{
let host=null,frame=null,receipt=0,pending=null,printing=false;
function close(){if(printing)return;if(host?.open)host.close();}
function create(){if(host)return;host=document.createElement('dialog');host.id='cajaPrintHost';host.innerHTML='<header><strong>Comprobante · Impresión</strong><button type="button">Cerrar ×</button></header><iframe title="Vista previa e impresión del comprobante"></iframe>';document.body.append(host);frame=host.querySelector('iframe');host.querySelector('button').onclick=close;host.addEventListener('cancel',event=>{if(printing)event.preventDefault();});}
async function engine(id){id=Number(id);if(!id)throw Error('Seleccioná un comprobante.');create();if(receipt===id&&pending)return pending;receipt=id;frame.src='gestion.html?reimprimirCaja='+id+'&embed=caja-impresion&origen=historial';pending=new Promise((resolve,reject)=>{const start=Date.now();const timer=setInterval(()=>{try{const actions=frame.contentWindow?.CorralonInvoiceHistoryActions;const ready=frame.contentDocument?.querySelector('#trialModal.open');if(actions&&ready){clearInterval(timer);resolve(actions);}else if(Date.now()-start>45000){clearInterval(timer);pending=null;reject(Error('No se pudo preparar la impresión. Volvé a intentarlo.'));}}catch(error){clearInterval(timer);pending=null;reject(error);}},100);});return pending;}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame?.contentWindow)return;if(event.data?.type==='corralon:caja-print-close')close();if(event.data?.type==='corralon:caja-print-busy'){printing=Boolean(event.data.busy);host.querySelector('button').disabled=printing;}});
window.CorralonInvoiceHistoryActions={cajaPrinters:async id=>(await engine(id)).cajaPrinters(),printCaja:async(id,printer)=>{printing=true;try{const actions=await engine(id);if(printer==='browser:'&&!host.open)host.showModal();await actions.printCaja(id,printer);}finally{printing=false;close();}},preview:async id=>{const actions=await engine(id);if(!frame.contentDocument?.querySelector('#trialModal.open'))await actions.preview(id);if(!host.open)host.showModal();return{preview:true};},reprint:async id=>{const result=await(await engine(id)).reprint(id);if(result?.preview&&!host.open)host.showModal();return result;},recall:async id=>{if(!window.CorralonFunciones.menuUserHasAccess('facturacion'))throw Error('No tenés permiso para abrir Facturación.');location.href='gestion.html?llamarCaja='+Number(id)+'#facturacion';},refreshAfterAnnul:async()=>{}};
})();</script>
<script id="history-standalone-navigation">(()=>{let initialized=false;const FX=window.CorralonFunciones;window.CorralonInvoiceSections={openMenu:()=>window.CorralonSidebarMenu?.open()};const api=window.CorralonSQLModules;api.beginStockArticleReport=()=>{if(!history.state?.stockArticleReport)history.pushState({...history.state,stockArticleReport:true},'',location.href);};api.endStockArticleReport=()=>{if(history.state?.stockArticleReport)history.back();};function follow(){if(!FX.menuSessionUser()||!FX.menuUserHasAccess('historial_movimiento'))return;const reports=window.CorralonStockArticleReports;if(!reports)return;if(initialized){if(history.state?.stockArticleReport&&reports.restoreReport())return;reports.show('articulo').catch(console.warn);return;}initialized=true;reports.show('articulo').catch(console.warn);}window.addEventListener('menu-user-validated',()=>{if(!initialized)follow();});window.addEventListener('popstate',follow);follow();})();</script>
