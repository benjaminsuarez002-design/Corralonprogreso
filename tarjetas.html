function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function label(v){const s=String(v||'').trim();return s?s.replace(/\b\w/g,c=>c.toUpperCase()):'Sin nombre'}function setStatus(text,error=false,modal=false){const e=modal?els.modalStatus:els.status;e.textContent=text;e.classList.toggle('error',error)}
