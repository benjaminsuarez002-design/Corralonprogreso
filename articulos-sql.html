<script id="article-native-source">(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const FX = window.CorralonFunciones;

  const articleSort=new Intl.Collator('es',{numeric:true});
  const articleNumber=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});

  const workspace=!embedded;

  const rememberedArticle=workspace?history.state?.articulosSqlFicha:undefined;
  function rememberArticleView(id){
    if(!workspace)return;
    try{history.replaceState({...history.state,articulosSqlFicha:id},'');}catch{}
  }
  let integratedCallbacks=null;
  const notifyParent=(type)=>{
    if(type==='corralon:article-editor-saved')integratedCallbacks?.onSaved?.(selected);
    if(type==='corralon:article-editor-close'){const callback=integratedCallbacks?.onClose;integratedCallbacks=null;callback?.();}
    if(embedded&&parent!==window)parent.postMessage({type,id:selected},location.origin);
  };
  if(embedded){
    const style=document.createElement('style');style.textContent='body>header,body>main{display:none}body{background:white}.article-dialog{width:calc(100vw - 8px)!important;max-width:none!important;max-height:calc(100dvh - 8px)!important;margin:4px!important}.article-dialog::backdrop{background:transparent}';document.head.append(style);
  }
  const editWeb=document.createElement('button');editWeb.type='button';editWeb.id='editArticleWeb';editWeb.textContent='✎';editWeb.title='Editar artículo web';editWeb.setAttribute('aria-label','Editar artículo web');
  els.articlePosition.after(editWeb);
  let articleListTop=0,articleFilterTimer=0;
  let articles = [], filtered = [], selected = null, generation = 0, stockGeneration = 0, catalogs = {}, draft = null, stockDraft = [], dirty = false, saving = false, loadingDetail = false;
  let classicArticle = null;

  const money = num;

  function status(text,error=false) { for(const element of [els.status,els.dialogStatus]){element.textContent=text;element.classList.toggle('error',error);} }
  async function api(params = {}, body = null) {
    if(body){
      const actor=FX.menuSessionUser();
      if(!actor?.id)throw new Error('Iniciá sesión desde el menú para editar Artículos y Precios.');
      body={...body,usuarioId:actor.id};
    }
    const response = await fetch(`/api/facturacion/articulos-sql?${new URLSearchParams(params)}`,{
      cache:'no-store',signal:AbortSignal.timeout(30000),
      ...(body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {})
    });

    return data;
  }
  function mayDiscard() {return !saving && !loadingDetail && (!dirty || confirm('Tenés cambios sin guardar. ¿Querés descartarlos?'));}

    pastingArticleTemplate=true;
    try{
      let text=clipboardText||(fromButton?articleTemplateText:'');
      if(!text&&navigator.clipboard?.readText){
        try{text=await navigator.clipboard.readText();}catch(_){}
      }
      if(!text)text=articleTemplateText||await FX.requestClipboardText();
      if(!text||draft!==initialDraft||!creatingArticle||saving||loadingDetail||!els.articleDialog.open)return;
      if(!fromButton&&text.startsWith('CORRALON_PRECIO_ARTICULO_V1')){await pasteProviderPrice(text);return;}
      if(dirty){status('Abrí un formulario nuevo y vacío para pegar la plantilla.',true);return;}
      if(!isArticleTemplate(text)){
        throw new Error('Copiá primero una ficha con Plantilla o Ctrl + Shift + C.');
      }
      applyArticleTemplate(text);
    }catch(error){status(error instanceof SyntaxError?'La plantilla del artículo no es válida.':error.message,true);}
    finally{pastingArticleTemplate=false;}
  }
  els.detail.addEventListener('paste',event=>{
    if(!creatingArticle)return;
    const text=event.clipboardData?.getData('text/plain')||'';
    if(!isArticleTemplate(text))return;
    event.preventDefault();
    pasteArticleTemplate(false,text);
  });
  let pastingProviderPrice=false;
  async function pasteProviderPrice(clipboardText){
    if(pastingProviderPrice||saving||loadingDetail||!draft)return;
    if(!FX.menuUserIsAdministrator('articulos_sql')&&!FX.menuUserIsAdministrator('facturacion')){
      status('Solo los administradores pueden editar artículos.',true);return;
    }
    const currentDraft=draft,currentId=selected;
    pastingProviderPrice=true;
    try{
      const text=clipboardText??await FX.requestClipboardText();
      if(!text)return;
      if(draft!==currentDraft||selected!==currentId||saving||loadingDetail||!els.articleDialog.open)return;
      const lines=String(text).trim().split(/\r?\n/);
      if(lines.shift()!=='CORRALON_PRECIO_ARTICULO_V1')throw new Error('Copiá una fila de Listas de proveedores con Ctrl + Shift + C.');
      const values=Object.fromEntries(lines.map(line=>{const at=line.indexOf('=');return at<0?['','']:[line.slice(0,at),line.slice(at+1)];}));
      const code=String(values.CODPROV||'').trim(),price=FX.parseLocaleNumber(values.PRECIO_FINAL||'');
      const provider=(catalogs.proveedores||[]).find(item=>String(item.id)===String(values.IDPROVEEDOR||'').trim());
      if(values.MODO!=='CODPROV'||!code||code.length>30||!Number.isFinite(price)||price<=0)throw new Error('El código o precio copiado no es válido.');
      if(!provider)throw new Error('El proveedor copiado no existe en el listado de proveedores de SQL.');
      const previous=draft.costoLista;
      draft.codigoProveedor=code;draft.idProveedor=Number(provider.id);draft.costoLista=round(price);
      recalculate(draft,'costoLista',previous);
      for(const [key,value] of [['codigoProveedor',code],['idProveedor',provider.nombre]]){
        const input=els.detail.querySelector(`[data-field="${key}"]`);input.value=value;input.setCustomValidity('');
      }
      closeCombo();syncNumbers();markDirty(true);
      queueArticleSave();
    }catch(error){status(error.message||'No se pudo pegar el precio del proveedor.',true);}
    finally{pastingProviderPrice=false;}
  }
  document.addEventListener('keydown',event=>{
    if(!els.articleDialog.open||!els.articleDialog.contains(event.target)||!(event.ctrlKey||event.metaKey)||!event.shiftKey||event.altKey||event.isComposing)return;
    const key=event.key.toLowerCase();
    if(key!=='c'&&key!=='v')return;
    event.preventDefault();event.stopImmediatePropagation();
    if(event.repeat)return;
    if(key==='c')copyArticleTemplate();
    else if(creatingArticle)pasteArticleTemplate();
    else pasteProviderPrice();
  },true);
  document.addEventListener('keydown',event=>{
    if(!els.articleDialog.open)return;
    if(event.key!=='PageDown'&&event.key!=='PageUp')return;
    event.preventDefault();if(event.repeat)return;
    moveArticle(event.key==='PageDown'?1:-1);
  });
  window.addEventListener('beforeunload',event=>{if(dirty||saving||listSaves.size||listEditor?.input.value!==listEditor?.initialValue||Object.values(newListValues).some(Boolean)){event.preventDefault();event.returnValue='';}});
  const articleLoadMore=$('articleLoadMore');
  function updateArticleLoadMore(){
    articleLoadMore.hidden=articleRows.getCount()>=filtered.length||articleTableScroll.scrollHeight>articleTableScroll.clientHeight;
  }
  const articleRows=FX.bindIncrementalRendering({
    root:articleTableScroll,batchSize:articleBatchSize,threshold:1,getTotal:()=>filtered.length,
    renderRange:(start,end,replace)=>{
      const html=articleRowsHtml(start,end)||'<tr><td colspan="8" class="empty">No se encontraron artículos.</td></tr>';
      if(replace)els.articles.innerHTML=html;else els.articles.insertAdjacentHTML('beforeend',html);
    },
    afterRender:(count,total)=>{
      const label=count===1?'artículo cargado':'artículos cargados';
      els.page.textContent=`${count.toLocaleString('es-AR')} ${label} de ${total.toLocaleString('es-AR')}`;
      updateArticleLoadMore();
    }
  });
  articleLoadMore.addEventListener('click',()=>articleRows.ensure(articleRows.getCount()+articleBatchSize));
  new ResizeObserver(updateArticleLoadMore).observe(articleTableScroll);
  editWeb.addEventListener('click',async()=>{
    if(articleSavePromise)await articleSavePromise;
    if(saving||loadingDetail||!selected)return;
    if(dirty){status('Guardá o descartá los cambios de la ficha antes de abrir el editor web.',true);return;}
    editWeb.disabled=true;
    try{
      const system=window.CorralonSystem;
      const stored=await system.catalog.fetchArticle(selected);
      const article=stored||{codigo:selected,idart:selected,nombre:draft.descripcionWeb||draft.descripcion,descripcion:draft.descripcionWeb||draft.descripcion,precio:draft.minorista,rubro:draft.rubro,codProv:draft.codigoProveedor};
      const operation={articles:[article],onClose:()=>{showArticleEditor();editWeb.disabled=false;},save:async(_list,updated)=>{
        if(stored){await system.catalog.saveArticleEdits([updated]);return;}
        const response=await fetch('/api/local-articles/catalog',{cache:'no-store'}),catalog=await response.json();
        if(!response.ok||!catalog.token)throw new Error(catalog.error||'No se pudo conectar al editor local.');
        const published=await fetch('/api/local-articles/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Articles-Token':catalog.token},body:JSON.stringify({id:selected,article:updated})});
        const result=await published.json();if(!published.ok)throw new Error(result.error||'No se pudo guardar la ficha web.');
      }};
      els.articleDialog.close();
      if(!system.articleEditor.open(selected,{articles:[article],operation}))showArticleEditor();
    }catch(error){status(error.message,true);editWeb.disabled=false;}
  });
  render(true);const initialLoad=(detailOnly?api({catalogos:1}).then(data=>{catalogs=data;}):load()).then(()=>{
    if(rememberedArticle===null)return;
    const articleToOpen=rememberedArticle??requestedArticle;
    if(articleToOpen&&/^\d{6}$/.test(articleToOpen))return select(articleToOpen,true);
    if(workspace&&location.hash!=='#sql/articulos/consultar'&&filtered.length)return select(filtered[0].id,true,false);});
  window.CorralonSQLArticleEditor={async open(id,callbacks={}){
    if(!await mayLeaveArticle())return false;
    await initialLoad;integratedCallbacks=callbacks;await select(String(id),true);return els.articleDialog.open;
  }};
})();
</script>
<script id="article-standalone-navigation">(()=>{function follow(){if(new URLSearchParams(location.search).has("embed"))return;if(location.hash==="#sql/articulos/consultar"){const field=document.getElementById("search");field?.focus();field?.select();}}window.addEventListener("hashchange",follow);window.addEventListener("DOMContentLoaded",follow);follow();})();</script>
