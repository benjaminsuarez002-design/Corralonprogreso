<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artículos</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="nav-helper.js"></script>
  <script src="menu-auth-guard.js" data-menu-guard="articulos_sql"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--corralon-bg);color:var(--corralon-text);font:14px Barlow,Arial,sans-serif}header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--corralon-line)}h1{margin:0;color:var(--corralon-red);font:900 32px 'Barlow Condensed',Arial}header a{margin-left:auto;color:var(--corralon-red)}button,input,select{font:inherit;border:1px solid var(--corralon-line-strong);border-radius:7px;padding:9px;background:white;color:inherit}button{cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--corralon-red);outline-offset:2px}main{padding:18px 24px}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}label{display:grid;gap:5px;color:var(--corralon-muted);font-weight:600}.search{flex:1;min-width:240px}select{max-width:260px}.status{min-height:24px;margin:8px 0;color:var(--corralon-muted)}.status.error{color:var(--corralon-red-dark)}.layout{display:grid;grid-template-columns:minmax(400px,1fr) minmax(390px,1fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--corralon-line);border-radius:12px;overflow:hidden}.scroll{overflow:auto;max-height:67vh}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:10px;border-bottom:1px solid var(--corralon-line);text-align:left}th{background:var(--corralon-soft-2);color:var(--corralon-text);white-space:nowrap;position:sticky;top:0}td.numeric{text-align:right;white-space:nowrap}tbody tr:nth-child(even){background:var(--corralon-soft)}#articles tr.selected{background:var(--corralon-selection)}#articles button{border:0;background:transparent;padding:0;color:var(--corralon-text);text-align:left;font-weight:700}#articles button:hover{text-decoration:underline}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-top:1px solid var(--corralon-line)}.detail{padding:18px}.detail h2{font:900 25px 'Barlow Condensed',Arial;margin:0 0 14px}.detail h3{font:700 21px 'Barlow Condensed',Arial;margin:20px 0 9px;color:var(--corralon-text)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}dl{margin:0}dt{font-size:12px;color:var(--corralon-muted);margin-bottom:4px}dd{margin:0;font-weight:600;overflow-wrap:anywhere}.wide{grid-column:1/-1}.money{background:var(--corralon-soft);padding:10px;border-radius:7px}.flags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.flag{border-radius:6px;background:var(--corralon-soft-2);padding:7px}.flag.active{background:#def5e8;color:#176f45}.flag.suspended{background:#ffe2e8;color:#a31835}.empty{padding:30px;color:var(--corralon-muted);text-align:center}.sales{overflow:auto}.stock-total{margin:10px 0;text-align:right;font-weight:700}.note{font-size:12px;color:var(--corralon-muted);margin:18px 0 0}@media(max-width:1000px){.layout{grid-template-columns:1fr}.scroll{max-height:48vh}main{padding:12px}header{padding:12px}h1{font-size:28px}}@media(max-width:500px){.filters label{width:100%}select{max-width:none}.fields{grid-template-columns:1fr}.wide{grid-column:auto}th,td{padding:8px}.detail{padding:12px}}
    fieldset{border:0;padding:0;margin:0;min-width:0}.detail input,.detail select{width:100%;max-width:none}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.edit-actions{position:sticky;bottom:0;background:#fff;padding:14px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}#saveArticle{background:var(--corralon-red);color:#fff}.edit-actions span{color:var(--corralon-muted)}.sales input[type=number]{min-width:95px}#editStatus{font-size:12px}
    .layout{display:block}.scroll{max-height:max(240px,calc(100dvh - 250px))}.article-dialog{width:min(980px,calc(100vw - 24px));max-height:92dvh;padding:0;border:1px solid var(--corralon-line);border-radius:12px;background:#fff;color:inherit;box-shadow:var(--corralon-shadow)}.article-dialog::backdrop{background:rgba(0,0,0,.45)}.dialog-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--corralon-soft);border-bottom:1px solid var(--corralon-line)}.dialog-bar strong{font-size:18px}.dialog-bar span{margin-right:auto;color:var(--corralon-muted);font-size:12px}.dialog-status{margin:0;padding:8px 18px 0}.article-dialog .detail{padding-top:12px}body:has(.article-dialog[open]){overflow:hidden}@media(max-width:500px){.dialog-bar{gap:6px;padding:10px}.dialog-bar strong{width:100%}.dialog-bar button{padding:8px}.dialog-status{padding:8px 12px 0}}
    #articles td{padding-top:1px;padding-bottom:1px}
    #articles td.is-selected{background:var(--corralon-selection)}
    #articles td:focus{outline:2px solid var(--corralon-red);outline-offset:-2px}
    th[data-sort-key]{cursor:pointer;user-select:none}
    th.sort-asc::after{content:' ↑'}th.sort-desc::after{content:' ↓'}
    .article-dialog .dialog-bar{padding:1px 12px;gap:8px;min-height:30px}
    .article-dialog .dialog-status{padding:1px 12px;min-height:0;margin:0;line-height:18px}
    .article-dialog .detail{padding:1px 12px}
    .article-dialog .detail h2{margin:1px 0;line-height:26px}
    .article-dialog .detail h3{margin:4px 0 1px;line-height:23px}
    .article-dialog .fields{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px}
    .article-dialog .fields .wide{grid-column:span 2}
    .article-dialog label{gap:1px;line-height:18px}
    .article-dialog input,.article-dialog select,.article-dialog button{padding:1px 8px;line-height:18px;min-height:22px}
    .article-dialog .flags{margin:4px 0;gap:10px}
    .article-dialog .money{padding:1px 6px;grid-template-columns:repeat(3,minmax(0,1fr))}
    .article-dialog th,.article-dialog td{padding:1px 8px;line-height:18px}
    .article-dialog .stock-total{margin:1px 0;line-height:18px}
    .article-dialog .edit-actions{padding:1px 0;gap:8px}
    .article-dialog .note{margin:1px 0;line-height:16px}
    @media(max-width:650px){.article-dialog .fields,.article-dialog .money{grid-template-columns:repeat(2,minmax(0,1fr))}.article-dialog .fields .wide{grid-column:1/-1}}
    .article-dialog .article-identity{grid-template-columns:repeat(2,minmax(0,1fr)) auto;align-items:end;margin-bottom:4px}
    .article-dialog .article-main-fields .wide{grid-column:1/-1}
    .filters .article-combo{width:260px;max-width:100%}
    .filters label:last-child .article-combo{width:120px}
    .article-combo{position:relative;display:block;min-width:0}
    .article-combo input{padding-right:25px;width:100%}
    .article-combo>button{position:absolute;right:1px;top:1px;bottom:1px;padding:0 5px;border:0;background:transparent;min-height:0}
    .article-combo-options{position:absolute;top:100%;left:0;right:0;z-index:10;max-height:190px;overflow:auto;background:#fff;border:1px solid var(--corralon-line-strong);box-shadow:0 4px 12px var(--corralon-text)33}
    .article-combo-options[hidden]{display:none}
    .article-combo-options>span{display:block;padding:3px 8px;font-weight:400;cursor:pointer}
    .article-combo-options>span:hover,.article-combo-options>span.active{background:var(--corralon-selection)}
  </style>
  <link rel="stylesheet" href="theme-corralon.css">
  <script src="funciones.js"></script>
  <script src="corralon-system.js"></script>
  <script src="articulos-sql.js" defer></script>
</head>
<body data-page-theme="articulos-sql">
  <header><h1>Artículos</h1><a href="menu.html">Menú</a><button id="reload">Actualizar</button></header>
  <main>
    <div class="filters">
      <label class="search">Buscar artículo<input id="search" type="search" placeholder="Descripción, ID, código de proveedor o barras" autocomplete="off"></label>
      <label>Proveedor<span class="article-combo"><input id="provider" data-article-combo data-filter-value="" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="article-options-provider" value="Todos"><button type="button" data-combo-toggle="provider" tabindex="-1" aria-label="Desplegar Proveedor">▾</button><span id="article-options-provider" class="article-combo-options" role="listbox" hidden></span></span></label>
      <label>Rubro<span class="article-combo"><input id="category" data-article-combo data-filter-value="" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="article-options-category" value="Todos"><button type="button" data-combo-toggle="category" tabindex="-1" aria-label="Desplegar Rubro">▾</button><span id="article-options-category" class="article-combo-options" role="listbox" hidden></span></span></label>
      <label>Estado<span class="article-combo"><input id="state" data-article-combo data-filter-value="active" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="article-options-state" value="Activos"><button type="button" data-combo-toggle="state" tabindex="-1" aria-label="Desplegar Estado">▾</button><span id="article-options-state" class="article-combo-options" role="listbox" hidden></span></span></label>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="layout">
      <section class="panel" aria-label="Listado de artículos">
        <div class="scroll"><table><thead><tr><th data-col="0" data-sort-key="id">ID art.</th><th data-col="1" data-sort-key="codigoProveedor">Cód. prov.</th><th data-col="2" data-sort-key="descripcion">Descripción</th><th data-col="3" data-sort-key="costoLista">Costo de lista</th><th data-col="4" data-sort-key="suspendido">Suspendido</th><th data-col="5" data-sort-key="proveedor">Proveedor</th><th data-col="6" data-sort-key="rubro">Rubro</th><th data-col="7" data-sort-key="ultimaActualizacion">Últ. act.</th></tr></thead><tbody id="articles"></tbody></table></div>
        <div class="pager"><span id="page" role="status"></span></div>
      </section>
    </div>
  </main>
  <dialog id="articleDialog" class="article-dialog" aria-labelledby="articleDialogTitle">
    <div class="dialog-bar"><strong id="articleDialogTitle">Ficha del artículo</strong><span id="articlePosition"></span><button id="prevArticle" type="button" title="Artículo anterior (Re Pág)">← Re Pág</button><button id="nextArticle" type="button" title="Artículo siguiente (Av Pág)">Av Pág →</button><button id="closeArticle" type="button" aria-label="Cerrar ficha">Cerrar ✕</button></div>
    <div id="dialogStatus" class="status dialog-status" role="status" aria-live="polite"></div>
    <section id="detail" class="detail" aria-label="Ficha del artículo"></section>
  </dialog>
</body>
</html>
